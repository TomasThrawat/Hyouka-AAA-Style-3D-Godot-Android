name: Godot GUI Smoke Final

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GUI dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends xvfb x11-utils xcursor-themes adwaita-icon-theme curl unzip python3 file
          command -v Xvfb
          command -v xdpyinfo
          test -d /usr/share/icons/Adwaita/cursors
          CURSOR_DIR=/usr/share/icons/Adwaita/cursors
          if [ ! -e "$CURSOR_DIR/crossed_circle" ]; then
            cp -f "$CURSOR_DIR/not-allowed" "$CURSOR_DIR/crossed_circle"
          fi
          test -s "$CURSOR_DIR/crossed_circle"

      - name: Download official Godot 4.7.2
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -perm -111 -name "Godot_v4.7.2-stable_linux.x86_64" -print -quit)"
          test -n "$GODOT_BIN"
          ln -sfn "$GODOT_BIN" "$RUNNER_TEMP/godot/Godot"
          "$RUNNER_TEMP/godot/Godot" --version

      - name: Import project
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/godot/Godot" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"

      - name: Run native graphical Godot smoke test
        env:
          DISPLAY: ":99"
          XCURSOR_THEME: Adwaita
          XCURSOR_PATH: /usr/share/icons
          XCURSOR_SIZE: "24"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -Eeuo pipefail
          sed -i 's/window\/vsync\/vsync_mode=1/window\/vsync\/vsync_mode=0/' project.godot
          Xvfb :99 -extension XKEYBOARD -screen 0 1280x720x24 -ac +extension GLX >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1
          set +e
          "$RUNNER_TEMP/godot/Godot" --verbose --path . --display-driver x11 --audio-driver Dummy --windowed --resolution 1280x720 --script runtime_gui_smoke_test.gd >"$RUNNER_TEMP/gui.log" 2>&1
          GODOT_RC=$?
          set -e
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/xvfb.log
          ! grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log"
          ! grep -Eai "ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" /tmp/xvfb.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
          test "$GODOT_RC" -eq 0

      - name: Read complete logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/xvfb.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
