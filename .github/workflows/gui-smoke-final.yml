name: Godot GUI Smoke Final

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Wayland GUI dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in weston curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing Wayland GUI dependency: $bin"
              need_install=1
            fi
          done
          if [ "$need_install" -eq 0 ]; then
            echo "All required Wayland GUI dependencies are installed"
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends weston curl unzip python3 file
          for bin in weston curl unzip python3 file; do
            command -v "$bin" >/dev/null 2>&1
          done

      - name: Download official Godot 4.7.2
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -perm -111 -name "Godot_v4.7.2-stable_linux.x86_64" -print -quit)"
          test -n "$GODOT_BIN"
          ln -sfn "$GODOT_BIN" "$RUNNER_TEMP/godot/Godot"
          "$RUNNER_TEMP/godot/Godot" --version

      - name: Import project
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/godot/Godot" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"

      - name: Run native graphical Godot smoke test on Wayland
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          WAYLAND_DISPLAY: wayland-1
          GODOT_WAYLAND_DISABLE_LIBDECOR: "1"
          NO_AT_BRIDGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket="$WAYLAND_DISPLAY" --width=1280 --height=720 --idle-time=0 --no-config >/tmp/weston.log 2>&1 &
          WESTON_PID=$!
          for _ in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
              break
            fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          set +e
          "$GODOT_BIN" --path . --display-server wayland --audio-driver Dummy --windowed --resolution 1280x720 --script runtime_gui_smoke_test.gd >"$RUNNER_TEMP/gui.log" 2>&1
          GODOT_RC=$?
          set -e
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/weston.log
          GODOT_ISSUES="$(grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log" || true)"
          WESTON_ISSUES="$(grep -Eai "ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" /tmp/weston.log || true)"
          if [ -n "$GODOT_ISSUES" ] || [ -n "$WESTON_ISSUES" ]; then
            exit 1
          fi
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
          test "$GODOT_RC" -eq 0

      - name: Read complete Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/weston.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
