name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          set -Eeuo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"
          echo "Android SDK: $ANDROID_HOME"
          echo "Platform: $ANDROID_HOME/platforms/android-35"
          echo "Build tools: $ANDROID_HOME/build-tools/35.0.0"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3 file

      - name: Download official Godot 4.7.2 .NET
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt"
          grep "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" --version

      - name: Install Godot Android .NET export templates
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -Eeuo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          extract_dir="$RUNNER_TEMP/godot/export_templates"
          mkdir -p "$template_dir" "$extract_dir"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -d "$extract_dir"
          test -f "$extract_dir/templates/android_debug.apk"
          test -f "$extract_dir/templates/android_release.apk"
          cp "$extract_dir/templates/android_debug.apk" "$template_dir/android_debug.apk"
          cp "$extract_dir/templates/android_release.apk" "$template_dir/android_release.apk"
          test -f "$template_dir/android_debug.apk"
          test -f "$template_dir/android_release.apk"

      - name: Create Android debug keystore
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Import Godot project
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Validate Godot project
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/godot-validate.log"
          ! grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/godot-import.log" "$RUNNER_TEMP/godot-validate.log"

      - name: Run Godot gameplay self-test
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path . --script runtime_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/godot-self-test.log"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -Eeuo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/HyoukaNeonFrontier-debug.apk 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s build/HyoukaNeonFrontier-debug.apk
          unzip -t build/HyoukaNeonFrontier-debug.apk >/dev/null
          file build/HyoukaNeonFrontier-debug.apk
          ls -lh build/HyoukaNeonFrontier-debug.apk

      - name: Scan Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/godot-import.log"
          cat "$RUNNER_TEMP/godot-validate.log"
          cat "$RUNNER_TEMP/godot-export.log"
          cat "$RUNNER_TEMP/godot-self-test.log"
          if grep -Eiq "ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/godot-import.log" "$RUNNER_TEMP/godot-validate.log" "$RUNNER_TEMP/godot-export.log" "$RUNNER_TEMP/godot-self-test.log"; then
            echo "Unexpected Godot log marker found."
            exit 1
          fi

      - name: Android emulator gameplay smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          disk-size: 6144M
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p ui-test
            adb install -r build/HyoukaNeonFrontier-debug.apk
            adb shell am force-stop com.tomasthrawat.hyoukaneonfrontier
            adb shell monkey -p com.tomasthrawat.hyoukaneonfrontier 1
            sleep 4
            SIZE="$(adb shell wm size | sed -n 's/.*: //p' | tr -cd '0-9x\n' | tail -1)"
            WIDTH="$(echo "$SIZE" | cut -d'x' -f1)"
            HEIGHT="$(echo "$SIZE" | cut -d'x' -f2)"
            test -n "$WIDTH"
            test -n "$HEIGHT"
            CENTER_X=$((WIDTH / 2))
            START_Y=$((HEIGHT * 7 / 10))
            JOY_X=140
            JOY_Y=$((HEIGHT - 120))
            RIGHT_X=$((WIDTH - 120))
            RIGHT_Y=$((HEIGHT - 175))
            RIGHT_LOW_Y=$((HEIGHT - 82))
            MID_RIGHT_X=$((WIDTH - 285))
            PAUSE_X=$((WIDTH - 48))
            PAUSE_Y=78

            adb exec-out screencap -p > ui-test/menu.png
            adb shell input tap "$CENTER_X" "$START_Y"
            sleep 2
            adb exec-out screencap -p > ui-test/game-start.png

            adb shell input swipe "$JOY_X" "$JOY_Y" "$JOY_X" "$((HEIGHT - 175))" 350
            adb shell input tap "$RIGHT_X" "$RIGHT_Y"
            adb shell input tap "$RIGHT_X" "$RIGHT_LOW_Y"
            adb shell input tap "$MID_RIGHT_X" "$RIGHT_Y"
            adb shell input tap "$MID_RIGHT_X" "$RIGHT_LOW_Y"
            adb shell input tap "$PAUSE_X" "$PAUSE_Y"
            sleep 1
            adb exec-out screencap -p > ui-test/paused.png
            adb shell input tap "$PAUSE_X" "$PAUSE_Y"
            sleep 2
            adb shell input tap "$RIGHT_X" "$RIGHT_Y"
            sleep 1
            adb exec-out screencap -p > ui-test/gameplay.png

            adb shell pidof com.tomasthrawat.hyoukaneonfrontier
            adb logcat -d > ui-test/logcat.txt
            if grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL|SIGSEGV|SIGABRT" ui-test/logcat.txt; then
              echo "Android runtime failure detected."
              exit 1
            fi

      - name: Upload UI test evidence
        uses: actions/upload-artifact@v7
        with:
          name: HyoukaNeonFrontier-UI-Test
          path: ui-test/
          if-no-files-found: error
          retention-days: 7

      - name: Verify repository is APK-only
        run: |
          set -Eeuo pipefail
          if find . -type f \( -iname "*.html" -o -iname "*.htm" \) -print -quit | grep -q .; then
            echo "HTML files are not allowed in this APK-only repository."
            exit 1
          fi
          test -f project.godot
          test -f export_presets.cfg
          test -f build/HyoukaNeonFrontier-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HyoukaNeonFrontier-APK
          path: build/HyoukaNeonFrontier-debug.apk
          if-no-files-found: error
          retention-days: 14
