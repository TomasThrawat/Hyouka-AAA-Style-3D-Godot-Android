name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3 jq file

      - name: Download official Godot 4.7.2 .NET
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS"
          grep "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" SHA512-SUMS | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" --version

      - name: Install Android export templates
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/templates/android_debug.apk"

      - name: Create Android debug keystore
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate Godot project
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-validate.log"
          ! grep -Eiq "ERROR|FAILED|EXCEPTION|FATAL" "$RUNNER_TEMP/godot-validate.log"

      - name: Export debug APK
        run: |
          set -Eeuo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/HyoukaNeonFrontier-debug.apk 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s build/HyoukaNeonFrontier-debug.apk
          unzip -t build/HyoukaNeonFrontier-debug.apk >/dev/null
          file build/HyoukaNeonFrontier-debug.apk
          ls -lh build/HyoukaNeonFrontier-debug.apk

      - name: Scan Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/godot-validate.log"
          cat "$RUNNER_TEMP/godot-export.log"
          if grep -Eiq "ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/godot-validate.log" "$RUNNER_TEMP/godot-export.log"; then
            echo "Unexpected Godot log marker found."
            exit 1
          fi

      - name: Verify repository is APK-only
        run: |
          set -Eeuo pipefail
          if find . -type f \( -iname "*.html" -o -iname "*.htm" \) -print -quit | grep -q .; then
            echo "HTML files are not allowed in this APK-only repository."
            exit 1
          fi
          test -f project.godot
          test -f export_presets.cfg
          test -f build/HyoukaNeonFrontier-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyoukaNeonFrontier-APK
          path: build/HyoukaNeonFrontier-debug.apk
          if-no-files-found: error
          retention-days: 14
