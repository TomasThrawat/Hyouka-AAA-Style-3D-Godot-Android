name: Godot GUI Visual Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Install GUI support tools
        run: |
          set -Eeuo pipefail
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends weston curl unzip python3 file xcursor-themes libxcursor1
          command -v weston
          command -v curl
          command -v unzip
          command -v python3
          command -v file
          dpkg-query -W xcursor-themes >/dev/null
          dpkg-query -W libxcursor1 >/dev/null

      - name: Prepare complete Xcursor theme
        run: |
          set -Eeuo pipefail
          OVERLAY="$RUNNER_TEMP/xcursor-overlay/DMZ-White/cursors"
          mkdir -p "$OVERLAY"
          if [ -d /usr/share/icons/DMZ-White/cursors ]; then
            cp -a /usr/share/icons/DMZ-White/cursors/. "$OVERLAY/"
          fi
          SOURCE=""
          for candidate in             /usr/share/icons/DMZ-White/cursors/not-allowed             /usr/share/icons/DMZ-Black/cursors/not-allowed             /usr/share/icons/Adwaita/cursors/not-allowed             /usr/share/icons/DMZ-White/cursors/forbidden             /usr/share/icons/DMZ-White/cursors/left_ptr; do
            if [ -f "$candidate" ]; then
              SOURCE="$candidate"
              break
            fi
          done
          test -n "$SOURCE"
          ln -sfn "$SOURCE" "$OVERLAY/crossed_circle"
          test -e "$OVERLAY/crossed_circle"
          echo "XCURSOR_THEME=DMZ-White" >> "$GITHUB_ENV"
          echo "XCURSOR_SIZE=24" >> "$GITHUB_ENV"
          echo "XCURSOR_PATH=$RUNNER_TEMP/xcursor-overlay:/usr/share/icons:/usr/share/pixmaps" >> "$GITHUB_ENV"

      - name: Configure persistent headless Wayland
        run: |
          set -Eeuo pipefail
          RUNTIME="$RUNNER_TEMP/wayland-runtime"
          mkdir -p "$RUNTIME"
          chmod 700 "$RUNTIME"
          echo "XDG_RUNTIME_DIR=$RUNTIME" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-test" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=wayland" >> "$GITHUB_ENV"
          echo "DISPLAY=" >> "$GITHUB_ENV"
          echo "CI_GUI_SMOKE=1" >> "$GITHUB_ENV"

      - name: Start Weston headless compositor
        run: |
          set -Eeuo pipefail
          rm -f "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          nohup weston             --backend=headless-backend.so             --socket="$WAYLAND_DISPLAY"             --width=1280             --height=720             --idle-time=0             --no-config             >"$RUNNER_TEMP/weston.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/weston.pid"
          for _ in $(seq 1 40); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/weston.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.25
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          cat "$RUNNER_TEMP/weston.log"

      - name: Download official Godot 4.7.2 Standard
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_FOUND="$(find "$RUNNER_TEMP/godot" -type f -perm -111 -name "Godot_v4.7.2-stable_linux.x86_64" -print -quit)"
          test -n "$GODOT_FOUND"
          ln -sfn "$GODOT_FOUND" "$RUNNER_TEMP/godot/Godot"
          test -x "$RUNNER_TEMP/godot/Godot"
          "$RUNNER_TEMP/godot/Godot" --version

      - name: Import project
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"; then
            cat "$RUNNER_TEMP/import.log"
            exit 1
          fi

      - name: Run native graphical Godot smoke test on Wayland
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: "llvmpipe"
          NO_AT_BRIDGE: "1"
          GODOT_WAYLAND_DISABLE_LIBDECOR: "1"
        run: |
          set -Eeuo pipefail
          test -n "$WAYLAND_DISPLAY"
          test -n "$XDG_RUNTIME_DIR"
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          unset DISPLAY
          trap 'if [ -f "$RUNNER_TEMP/weston.pid" ]; then kill "$(cat "$RUNNER_TEMP/weston.pid")" 2>/dev/null || true; fi' EXIT
          set +e
          timeout 120s "$GODOT_BIN"             --display-driver wayland             --rendering-method gl_compatibility             --rendering-driver opengl3             --audio-driver Dummy             --windowed             --resolution 1280x720             --verbose             --log-file "$RUNNER_TEMP/godot-runtime.log"             "$RUNNER_TEMP/../does-not-exist" >/dev/null 2>&1
          GODOT_RC=$?
          set -e
          if [ "$GODOT_RC" -eq 0 ]; then
            echo "Unexpected success from negative probe"
            exit 1
          fi
          set +e
          timeout 120s "$GODOT_BIN"             --display-driver wayland             --rendering-method gl_compatibility             --rendering-driver opengl3             --audio-driver Dummy             --windowed             --resolution 1280x720             --verbose             --log-file "$RUNNER_TEMP/godot-runtime.log"             --path . >"$RUNNER_TEMP/gui.log" 2>&1
          GODOT_RC=$?
          set -e
          cat "$RUNNER_TEMP/gui.log"
          test -f "$RUNNER_TEMP/godot-runtime.log"
          cat "$RUNNER_TEMP/godot-runtime.log"
          if grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "Unexpected Godot diagnostics detected"
            exit 1
          fi
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
          test "$GODOT_RC" -eq 0

      - name: Read complete Godot and Weston logs
        if: always()
        run: |
          set -Eeuo pipefail
          echo "=== COMPLETE IMPORT LOG ==="
          cat "$RUNNER_TEMP/import.log" 2>/dev/null || true
          echo "=== COMPLETE GUI LOG ==="
          cat "$RUNNER_TEMP/gui.log" 2>/dev/null || true
          echo "=== COMPLETE GODOT RUNTIME LOG ==="
          cat "$RUNNER_TEMP/godot-runtime.log" 2>/dev/null || true
          echo "=== COMPLETE WESTON LOG ==="
          cat "$RUNNER_TEMP/weston.log" 2>/dev/null || true
