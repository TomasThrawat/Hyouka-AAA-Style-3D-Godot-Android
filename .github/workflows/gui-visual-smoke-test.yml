name: Godot GUI Visual Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb curl unzip python3 file

      - name: Download official Godot 4.7.2 .NET
        env:
          GODOT_VERSION: "4.7.2"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION}-stable/Godot_v$GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION}-stable/SHA512-SUMS.txt"
          grep "Godot_v$GODOT_VERSION}-stable_mono_linux_x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v$GODOT_VERSION}-stable_mono_linux_x86_64.zip"

      - name: Import project
        env:
          GODOT_BIN: $$ runner.temp }} /godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"

      - name: Launch graphical Godot smoke test
        env:
          GODOT_BIN: $$ runner.temp }} /godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
        run: |
          set -Eeuo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" || true' EXIT
          "$GODOT_BIN" --path . --display-driver x11 --audio-driver Dummy --script runtime_gui_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/gui.log"
          ! grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log"

      - name: Read complete Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
