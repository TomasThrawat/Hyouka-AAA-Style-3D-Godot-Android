name: Godot GUI Visual Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in sway curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing GUI tool: $bin"
              need_install=1
            fi
          done
          if [ "$need_install" -eq 0 ]; then
            echo "All required GUI tools are already installed"
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends sway curl unzip python3 file
          for bin in sway curl unzip python3 file; do
            command -v "$bin" >/dev/null 2>&1
          done

      - name: Download official Godot 4.7.2 .NET
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_mono_linux_x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_mono_linux_x86_64.zip"

      - name: Import project
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"; then
            cat "$RUNNER_TEMP/import.log"
            exit 1
          fi

      - name: Launch graphical Godot smoke test
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          WAYLAND_DISPLAY: wayland-1
          XDG_CURRENT_DESKTOP: sway
          XDG_SESSION_TYPE: wayland
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -Eeuo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat >"$RUNNER_TEMP/sway.conf" <<'EOF'
xwayland disable
default_border none
output HEADLESS-1 mode 1280x720
seat seat0 hide_cursor 0
EOF
          WLR_BACKENDS=headless WLR_RENDERER=pixman sway --unsupported-gpu -c "$RUNNER_TEMP/sway.conf" >/tmp/sway.log 2>&1 &
          SWAY_PID=$!
          trap 'kill "$SWAY_PID" || true' EXIT
          for _ in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
              break
            fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          "$GODOT_BIN" --path . --display-server wayland --audio-driver Dummy --windowed --resolution 1280x720 --script runtime_gui_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/gui.log"
          if grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log"; then
            cat "$RUNNER_TEMP/gui.log"
            exit 1
          fi
          if grep -Eiq "error|fatal|critical" /tmp/sway.log; then
            cat /tmp/sway.log
            exit 1
          fi

      - name: Read complete Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/sway.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
