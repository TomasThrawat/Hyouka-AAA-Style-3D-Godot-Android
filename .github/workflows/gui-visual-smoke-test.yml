name: Godot GUI Visual Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Install X11 GUI dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in Xvfb xdpyinfo curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing X11 GUI dependency: $bin"
              need_install=1
            fi
          done
          if [ "$need_install" -eq 0 ]; then
            echo "All required X11 GUI dependencies are already installed"
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends xvfb x11-utils curl unzip python3 file
          for bin in Xvfb xdpyinfo curl unzip python3 file; do
            command -v "$bin" >/dev/null 2>&1
          done

      - name: Download official Godot 4.7.2 Standard
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_FOUND="$(find "$RUNNER_TEMP/godot" -type f -perm -111 -name "Godot_v4.7.2-stable_linux.x86_64" -print -quit)"
          test -n "$GODOT_FOUND"
          ln -sfn "$GODOT_FOUND" "$RUNNER_TEMP/godot/Godot"
          test -x "$RUNNER_TEMP/godot/Godot"
          "$RUNNER_TEMP/godot/Godot" --version

      - name: Import project
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"; then
            echo "Godot import diagnostics detected"
            exit 1
          fi

      - name: Run native graphical Godot smoke test on X11
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" || true' EXIT
          for _ in $(seq 1 50); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1
          timeout 120s "$GODOT_BIN" --display-server x11 --audio-driver Dummy --windowed --resolution 1280x720 --script runtime_gui_smoke_test.gd >"$RUNNER_TEMP/gui.log" 2>&1
          cat "$RUNNER_TEMP/gui.log"
          if grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log"; then
            echo "Unexpected Godot diagnostics detected"
            exit 1
          fi
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"

      - name: Read complete Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/xvfb.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
