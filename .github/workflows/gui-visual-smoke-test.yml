name: Godot GUI Visual Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Install GUI dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in Xvfb xdpyinfo curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing GUI dependency: $bin"
              need_install=1
            fi
          done
          if [ ! -d /usr/share/icons/Adwaita/cursors ]; then
            echo "Missing Adwaita cursor theme"
            need_install=1
          fi
          if [ "$need_install" -eq 0 ]; then
            echo "All GUI dependencies and cursor theme are already installed"
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends xvfb x11-utils xcursor-themes adwaita-icon-theme curl unzip python3 file
          command -v Xvfb
          command -v xdpyinfo
          test -d /usr/share/icons/Adwaita/cursors
          CURSOR_DIR=/usr/share/icons/Adwaita/cursors
          if [ ! -e "$CURSOR_DIR/crossed_circle" ]; then
            FALLBACK_CURSOR=""
            for candidate in not-allowed crosshair left_ptr; do
              if [ -e "$CURSOR_DIR/$candidate" ]; then
                FALLBACK_CURSOR="$candidate"
                break
              fi
            done
            test -n "$FALLBACK_CURSOR"
            ln -s "$FALLBACK_CURSOR" "$CURSOR_DIR/crossed_circle"
          fi
          test -e "$CURSOR_DIR/crossed_circle"

      - name: Download official Godot 4.7.2 Standard
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_FOUND="$(find "$RUNNER_TEMP/godot" -type f -perm -111 -name "*linux.x86_64" -print -quit)"
          test -n "$GODOT_FOUND"
          printf '%s\n' "Godot binary: $GODOT_FOUND"
          ln -sfn "$GODOT_FOUND" "$RUNNER_TEMP/godot/Godot"
          test -x "$RUNNER_TEMP/godot/Godot"
          "$RUNNER_TEMP/godot/Godot" --version

      - name: Import project
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"; then
            echo "Godot import diagnostics detected"
            exit 1
          fi

      - name: Launch graphical Godot smoke test
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot
          DISPLAY: ":99"
          XCURSOR_THEME: Adwaita
          XCURSOR_PATH: /usr/share/icons
          XCURSOR_SIZE: "24"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -Eeuo pipefail
          Xvfb :99 -kb -screen 0 1280x720x24 -ac +extension GLX >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1

          set +e
          "$GODOT_BIN"             --verbose             --path .             --display-driver x11             --audio-driver Dummy             --windowed             --resolution 1280x720             --disable-vsync             --script runtime_gui_smoke_test.gd             >"$RUNNER_TEMP/gui.log" 2>&1
          GODOT_RC=$?
          set -e

          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/xvfb.log

          GODOT_ISSUES="$(grep -Eai "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/gui.log" || true)"
          XVFB_ISSUES="$(grep -Eai "ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" /tmp/xvfb.log || true)"

          if [ -n "$GODOT_ISSUES" ] || [ -n "$XVFB_ISSUES" ]; then
            echo "Unexpected Godot/Xvfb diagnostics:"
            printf '%s\n' "$GODOT_ISSUES"
            printf '%s\n' "$XVFB_ISSUES"
            exit 1
          fi

          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
          test "$GODOT_RC" -eq 0

      - name: Read complete Godot logs
        run: |
          set -Eeuo pipefail
          cat "$RUNNER_TEMP/import.log"
          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/xvfb.log
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
