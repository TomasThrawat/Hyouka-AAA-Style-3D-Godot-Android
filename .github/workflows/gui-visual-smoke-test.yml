name: Godot GUI Visual Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in weston curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing GUI tool: $bin"
              need_install=1
            fi
          done
          if [ "$need_install" -eq 0 ]; then
            echo "All required Wayland GUI tools are already installed"
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends weston curl unzip python3 file
          for bin in weston curl unzip python3 file; do
            command -v "$bin" >/dev/null 2>&1
          done

      - name: Download official Godot 4.7.2 Standard
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fsSLO "https://downloads.godotengine.org/4.7.2/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fsSLO "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux_x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_linux_x86_64.zip"

      - name: Import project
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux_x86_64/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/import.log"; then
            cat "$RUNNER_TEMP/import.log"
            exit 1
          fi

      - name: Launch graphical Godot smoke test
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux_x86_64/Godot_v4.7.2-stable_linux.x86_64
          DISPLAY: :99
          XCURSOR_THEME: Adwaita
          XCURSOR_PATH: /usr/share/icons      - name: Launch graphical Godot smoke test
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          WAYLAND_DISPLAY: wayland-1
          GODOT_WAYLAND_DISABLE_LIBDECOR: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -Eeuo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --width=1280 --height=720 --idle-time=0 >/tmp/weston.log 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" || true' EXIT
          for _ in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
              break
            fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"

          set +e
          "$GODOT_BIN" --verbose --path . --display-driver wayland --audio-driver Dummy --windowed --resolution 1280x720 --script runtime_gui_smoke_test.gd >"$RUNNER_TEMP/gui.log" 2>&1
          GODOT_RC=$?
          set -e
          echo "GODOT_PROCESS_EXIT=$GODOT_RC"

          cat "$RUNNER_TEMP/gui.log"
          cat /tmp/weston.log
          GODOT_ACTIONABLE="$(grep -Ei 'SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED' "$RUNNER_TEMP/gui.log" || true)"
          WESTON_ACTIONABLE="$(grep -Ei '(^|[[:space:]])(error|warning|fatal|critical)(:|[[:space:]])' /tmp/weston.log || true)"
          if [ -n "$GODOT_ACTIONABLE" ] || [ -n "$WESTON_ACTIONABLE" ]; then
            printf '%s
' "Unexpected Godot/Weston errors or warnings:" "$GODOT_ACTIONABLE" "$WESTON_ACTIONABLE"
            exit 1
          fi
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/gui.log"
          test "$GODOT_RC" -eq 0

