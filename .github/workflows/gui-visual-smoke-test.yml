name: Godot GUI Functional Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-functional-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          need_install=0
          for bin in curl unzip python3 file; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing build tool: $bin"
              need_install=1
            fi
          done
          if [ "$need_install" -eq 0 ]; then
            exit 0
          fi
          timeout 180 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          timeout 180 sudo apt-get install -y --no-install-recommends curl unzip python3 file

      - name: Download official Godot 4.7.2
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o Godot_v4.7.2-stable_linux.x86_64.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 60 -o SHA512-SUMS.txt "https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt"
          grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v4.7.2-stable_linux.x86_64.zip"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project with zero-warning gate
        run: |
          set -Eeuo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/godot-import.log"; then
            cat "$RUNNER_TEMP/godot-import.log"
            exit 1
          fi

      - name: Run native Godot UI/input smoke test
        env:
          CI_GUI_SMOKE: "1"
        run: |
          set -Eeuo pipefail
          timeout 45s "$GODOT_BIN" --headless --path . --script ci_gui_smoke.gd --quit-after 45 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -Eiq "SCRIPT ERROR|PARSE ERROR|ERROR|FAILED|EXCEPTION|FATAL|CRITICAL|WARNING|DEPRECATED" "$RUNNER_TEMP/godot-smoke.log"; then
            cat "$RUNNER_TEMP/godot-smoke.log"
            exit 1
          fi
          grep -q "GUI SMOKE TEST PASS" "$RUNNER_TEMP/godot-smoke.log"

      - name: Read complete Godot logs
        if: always()
        run: |
          set -Eeuo pipefail
          echo "=== COMPLETE GODOT IMPORT LOG ==="
          cat "$RUNNER_TEMP/godot-import.log" 2>/dev/null || true
          echo "=== COMPLETE GODOT SMOKE LOG ==="
          cat "$RUNNER_TEMP/godot-smoke.log" 2>/dev/null || true
